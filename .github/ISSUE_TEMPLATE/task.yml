name: Task / Feature Request
description: 新機能の追加やタスクの起票はこちら
title: "[Task]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        タスクの起票ありがとうございます。AIが適切に処理できるよう、種別、優先度とサイズを指定してください。
  - type: dropdown
    id: task-type
    attributes:
      label: Type (種別)
      description: タスクの種別を選択してください。
      options:
        - "Feature (新機能の追加)"
        - "Refactor (リファクタリング・コード改善)"
        - "Docs (ドキュメントの追加・修正)"
        - "Chore (ビルド・CI・依存関係・設定等の保守作業)"
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority (優先度)
      description: いつやるべきタスクですか？
      options:
        - "P0: Blocker (最優先・今すぐやる)"
        - "P1: High (スプリントの主目標)"
        - "P2: Normal (通常タスク)"
        - "P3: Low (余裕があれば/Nice to have)"
    validations:
      required: true
  - type: dropdown
    id: size
    attributes:
      label: Size (サイズ)
      description: タスクの規模感はどのくらいですか？（LはAIによって自動的に分割されます）
      options:
        - "Size: S (数ファイルの修正、数十分〜1時間程度)"
        - "Size: M (1つの機能追加、半日〜1日程度)"
        - "Size: L (エピック級、複数のサブタスクに分割が必要)"
    validations:
      required: true
  - type: textarea
    id: overview
    attributes:
      label: 概要・要件
      description: 実装したい機能の概要や要件を記載してください。
      placeholder: |
        ## 背景
        ...
        ## 要件
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: ai-instructions
    attributes:
      label: AIへの対応方針・指示
      description: AIエージェントに実装を依頼する際の具体的なアプローチや参考リンクがあれば記載してください。
  - type: input
    id: parent-issue
    attributes:
      label: 親Issue (もしあれば)
      description: このIssueがサブタスクの場合、親Issueの番号を `#123` の形式で記載してください。
