name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-test:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Ruff Formatter Check
        run: |
          cd backend
          uv run ruff format --check .
      - name: Run Ruff Linter
        run: |
          cd backend
          uv run ruff check .
      - name: Run pytest
        run: |
          cd backend
          uv run pytest

  frontend-test:
    name: Frontend Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      - name: Run oxlint
        run: |
          cd frontend
          npm run lint
      - name: Run vitest
        run: |
          cd frontend
          npm run test
      - name: Run build
        run: |
          cd frontend
          npm run build
