name: PR Lint

# GitHub Actions の pull_request イベントタイプ
# "synchronize" は正しいスペル（"synchronized" ではない点に注意）
on:
  pull_request:
    types: [opened, edited, synchronize]
    branches:
      - main

jobs:
  pr-body-check:
    name: PR Body Format Check
    runs-on: ubuntu-latest
    # Dependabot による自動生成 PR は人間用の本文テンプレート検証をバイパス
    if: github.actor != 'dependabot[bot]' && github.event.pull_request.user.login != 'dependabot[bot]'
    # pull-requests: write で PR へのコメント作成・更新・削除が可能
    # （GitHub では PR コメントは内部的に Issues API を使用するが、
    #  pull-requests: write で両方カバーされる）
    permissions:
      pull-requests: write
    steps:
      - name: PRタイトルのフォーマットチェック
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            if (context.actor === 'dependabot[bot]' || context.payload.pull_request.user?.login === 'dependabot[bot]') {
              core.info('🤖 Dependabotによる自動生成PRのため、タイトル検証をスキップします');
              return;
            }
            const title = context.payload.pull_request.title || '';
            const titleRegex = /^\[(Feature|Bugfix|Refactor|Docs|Chore)\]\s+.+/i;
            if (!titleRegex.test(title)) {
              core.setFailed(`PRタイトル「${title}」のフォーマットが不正です。"[種別] 変更の要約"（種別: Feature, Bugfix, Refactor, Docs, Chore）の形式にしてください（例: [Feature] ユーザー認証APIの追加）。`);
            } else {
              core.info(`✅ PRタイトルのフォーマットチェックに合格しました: ${title}`);
            }

      - name: PR本文のフォーマットチェック
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            if (context.actor === 'dependabot[bot]' || context.payload.pull_request.user?.login === 'dependabot[bot]') {
              core.info('🤖 Dependabotによる自動生成PRのため、本文フォーマット検証をスキップします');
              return;
            }
            const body = context.payload.pull_request.body || '';
            const errors = [];

            // ボットコメント識別用の一意マーカー（他Botとの誤検出を防止）
            const BOT_MARKER = '<!-- pr-lint-bot-marker -->';

            // ============================================================
            // ヘルパー: セクション内容を安全に抽出する
            // 「次の ## または ### 見出し、またはEOF」までをマッチさせる
            // ============================================================
            function extractSection(heading) {
              const escaped = heading.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              const regex = new RegExp(escaped + '[\\s\\S]*?(?=\\n#{2,3} |$)');
              const match = body.match(regex);
              return match ? match[0] : null;
            }

            // ============================================================
            // 1. 変更種別: チェックボックスが1つ以上チェックされているか
            // ============================================================
            const changeTypeSection = extractSection('## 変更種別');
            if (changeTypeSection) {
              const checked = (changeTypeSection.match(/- \[x\]/gi) || []).length;
              if (checked === 0) {
                errors.push('❌ **変更種別**: 1つ以上チェックしてください（feature / bugfix / refactor / docs / chore）');
              }
            } else {
              errors.push('❌ **変更種別**: セクションが見つかりません');
            }

            // ============================================================
            // 2. 影響範囲: チェックボックスが1つ以上チェックされているか
            // ============================================================
            const scopeSection = extractSection('## 影響範囲');
            if (scopeSection) {
              const checked = (scopeSection.match(/- \[x\]/gi) || []).length;
              if (checked === 0) {
                errors.push('❌ **影響範囲**: 1つ以上チェックしてください（frontend / backend / infra / docs）');
              }
            } else {
              errors.push('❌ **影響範囲**: セクションが見つかりません');
            }

            // ============================================================
            // 3. 関連Issue: "Closes #数字" or "Fixes #数字" or "Resolves #数字" が記載されているか
            // ============================================================
            const issueSection = extractSection('## 関連Issue');
            const branchName = context.payload.pull_request.head.ref;
            const branchIssueMatch = branchName.match(/issue-(\d+)/i);
            const branchIssueNumber = branchIssueMatch ? branchIssueMatch[1] : null;

            if (issueSection) {
              const hasIssueRef = /(?:closes|fixes|resolves)\s+#\d+/i.test(issueSection);
              if (!hasIssueRef) {
                errors.push('❌ **関連Issue**: `Closes #番号` の形式でIssueを紐づけてください');
              } else if (branchIssueNumber) {
                // ブランチ名に issue-XXX が含まれている場合、その番号と一致するか検証
                const regex = new RegExp(`(?:closes|fixes|resolves)\\s+#${branchIssueNumber}\\b`, 'i');
                if (!regex.test(issueSection)) {
                  errors.push(`❌ **関連Issue**: ブランチ名 (issue-${branchIssueNumber}) と一致するIssue (\`Closes #${branchIssueNumber}\`) を紐づけてください`);
                }
              }
            } else {
              errors.push('❌ **関連Issue**: セクションが見つかりません');
            }

            // ============================================================
            // 4. 「何を変更したか」が空でないか
            // ============================================================
            const whatSection = extractSection('### 何を変更したか');
            if (whatSection) {
              // テンプレートのプレースホルダーやコメントを除外して、実質的な記載があるか
              const content = whatSection
                .replace(/### 何を変更したか/, '')
                .replace(/<!--[\s\S]*?-->/g, '')
                .replace(/-\s*$/gm, '')
                .trim();
              if (content.length === 0) {
                errors.push('❌ **何を変更したか**: 変更内容を具体的に記載してください');
              }
            } else {
              errors.push('❌ **何を変更したか**: セクションが見つかりません');
            }

            // ============================================================
            // 5. 「なぜ変更したか」が空でないか
            // ============================================================
            const whySection = extractSection('### なぜ変更したか');
            if (whySection) {
              const content = whySection
                .replace(/### なぜ変更したか/, '')
                .replace(/<!--[\s\S]*?-->/g, '')
                .trim();
              if (content.length === 0) {
                errors.push('❌ **なぜ変更したか**: 変更の背景・理由を記載してください');
              }
            } else {
              errors.push('❌ **なぜ変更したか**: セクションが見つかりません');
            }

            // ============================================================
            // 6. 品質・ドキュメント更新チェック
            // ============================================================
            const qualitySection = extractSection('## 品質・ドキュメント');
            if (qualitySection) {
              // 各チェックボックス行を抽出し、個別に検証する
              const checkboxLines = qualitySection.match(/^\s*- \[.*?\].*$/gm) || [];
              for (const line of checkboxLines) {
                // チェック済み: [x], [X]
                // N/A: [N/A], [n/a], [-]
                // 未チェック: [ ]
                const isChecked = /- \[\s*[xX]\s*\]/.test(line);
                const isNA = /- \[\s*(N\/A|n\/a|-)\s*\]/.test(line);
                
                if (!isChecked && !isNA) {
                  errors.push('❌ **品質・ドキュメント**: すべてのチェックボックスを確認してください（該当しない場合は `- [N/A]` として理由を記載してください）');
                  break; // 1つ見つかれば十分
                }
              }
              
              // N/A理由のチェック
              const lines = qualitySection.split('\n');
              for (let i = 0; i < lines.length; i++) {
                if (lines[i].match(/- \[\s*(N\/A|n\/a|-)\s*\]/i)) {
                  const nextLine = lines[i+1] || '';
                  if (nextLine.includes('N/Aの理由:') && nextLine.split('N/Aの理由:')[1].trim().length === 0) {
                    let type = lines[i].includes('ドキュメント') ? 'ドキュメント更新' : 'テスト(TDD)';
                    errors.push(`❌ **品質・ドキュメント**: ${type} を N/A とした理由を記載してください`);
                  }
                }
              }
            } else {
              errors.push('❌ **品質・ドキュメント**: セクションが見つかりません');
            }

            // ============================================================
            // 7. 実態乖離チェック (Fact Audit: 実際の変更ファイルとの整合性)
            // ============================================================
            try {
              const files = await github.paginate(github.rest.pulls.listFiles, {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.payload.pull_request.number,
              });
              const filenames = files.map(f => f.filename);
              core.info(`PR変更ファイル数: ${filenames.length}`);

              // (1) docsのみの虚偽申告防止
              // 変更ファイルにドキュメント以外（*.md および docs/ 配下以外）が含まれているか判定
              const hasNonDocFiles = filenames.some(fn => !fn.endsWith('.md') && !fn.startsWith('docs/'));
              if (changeTypeSection) {
                const isDocsChecked = /- \[[xX]\]\s*docs\b/i.test(changeTypeSection);
                const otherTypesChecked = (changeTypeSection.match(/- \[[xX]\]\s*(feature|bugfix|refactor|chore)\b/gi) || []).length > 0;

                if (hasNonDocFiles && isDocsChecked && !otherTypesChecked) {
                  errors.push('❌ **変更種別（実態乖離）**: ドキュメント以外のファイル（コード、スクリプト、設定、CI等）が変更されていますが、変更種別で `docs (ドキュメントのみの変更)` のみがチェックされています。実態に即した種別（feature / bugfix / refactor / chore 等）をチェックしてください');
                }
              }

              // (2) 影響範囲のチェック漏れ防止
              if (scopeSection) {
                // Backend: backend/ 配下の変更
                const hasBackendChanges = filenames.some(fn => fn.startsWith('backend/'));
                const isBackendChecked = /- \[[xX]\]\s*backend\b/i.test(scopeSection);
                if (hasBackendChanges && !isBackendChecked) {
                  errors.push('❌ **影響範囲（チェック漏れ）**: `backend/` 配下のファイルが変更されていますが、影響範囲の `backend` がチェックされていません');
                }

                // Frontend: frontend/ 配下の変更
                const hasFrontendChanges = filenames.some(fn => fn.startsWith('frontend/'));
                const isFrontendChecked = /- \[[xX]\]\s*frontend\b/i.test(scopeSection);
                if (hasFrontendChanges && !isFrontendChecked) {
                  errors.push('❌ **影響範囲（チェック漏れ）**: `frontend/` 配下のファイルが変更されていますが、影響範囲の `frontend` がチェックされていません');
                }

                // Infra / Config: .github/, .agents/, .githooks/, scripts/, Docker, Makefile, 設定ファイル等
                const hasInfraChanges = filenames.some(fn =>
                  fn.startsWith('.github/') ||
                  fn.startsWith('.agents/') ||
                  fn.startsWith('.githooks/') ||
                  fn.startsWith('scripts/') ||
                  /^(Dockerfile|docker-compose(\.[^.]+)?\.ya?ml|Makefile|package\.json|package-lock\.json|\.gitignore|\.env.*)$/i.test(fn)
                );
                const isInfraChecked = /- \[[xX]\]\s*infra\b/i.test(scopeSection);
                if (hasInfraChanges && !isInfraChecked) {
                  errors.push('❌ **影響範囲（チェック漏れ）**: インフラ・CI・設定ファイル（.github/, .agents/, .githooks/, Makefile, package.json等）が変更されていますが、影響範囲の `infra` がチェックされていません');
                }
              }
            } catch (err) {
              core.warning(`変更ファイル一覧の取得・実態照合に失敗しました: ${err.message}`);
            }

            // ============================================================
            // 結果の出力
            // ============================================================
            if (errors.length > 0) {
              const comment = [
                BOT_MARKER,
                '## ⚠️ PR本文のフォーマットチェック',
                '',
                '以下の項目が未記入または不足しています。修正をお願いします。',
                '',
                ...errors,
                '',
                '---',
                '> このチェックは `.github/workflows/pr-lint.yml` で自動実行されています。',
              ].join('\n');

              // 既存のボットコメントを探して更新、なければ新規作成
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
              });

              const botComment = comments.find(c => c.body && c.body.includes(BOT_MARKER));

              if (botComment) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: botComment.id,
                  body: comment,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.payload.pull_request.number,
                  body: comment,
                });
              }

              // エラーとして出力し、マージをブロックする
              core.setFailed('PR本文のフォーマットに不足があります。PRコメントを確認して修正してください。');
            } else {
              // チェック通過時は既存のボットコメントを削除
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
              });

              const botComment = comments.find(c => c.body && c.body.includes(BOT_MARKER));

              if (botComment) {
                await github.rest.issues.deleteComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: botComment.id,
                });
              }

              core.info('✅ PR本文のフォーマットチェックに合格しました');
            }
