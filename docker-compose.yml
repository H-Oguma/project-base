# 注意: このプロジェクトは開発環境において完全ローカル実行（脱Docker）に移行しました。
# 開発時は `npm run dev` 等を使用して起動してください。
# このファイルは、本番環境向けのコンテナビルド動作確認などの特殊な用途にのみ使用します。

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      # Nginxが非root環境で8080ポートでリッスンしているため
      - "5173:8080"
